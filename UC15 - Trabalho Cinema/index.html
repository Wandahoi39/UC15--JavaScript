<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>Descubra o Filme</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1> DESCUBRA O FILME</h1>

        <p class="subtitulo">
            Você consegue descobrir o filme?
        </p>

        <div class="pontuacao">
            Pontos: <span id="pontos">100</span>
        </div>

        <div class="pista">

            <h2>
                🔎 Pista <span id="numeroPista">1</span>
            </h2>

            <p id="textoPista">
                O protagonista é um jovem que leva uma vida comum,
                mas acaba ganhando poderes especiais.
            </p>

        </div>

        <input
            type="text"
            id="resposta"
            placeholder="Digite o nome do filme"
        >

        <div class="botoes">

            <button onclick="verificarResposta()">
                🎯 Responder
            </button>

            <button onclick="novaPista()" id="botaoPista">
                💡 Nova pista
            </button>

        </div>

        <p id="mensagem"></p>

        <h2 id="resultado"></h2>

        <button
            onclick="reiniciarJogo()"
            id="reiniciar"
        >
            🔄 Jogar novamente
        </button>

    </div>

    <script src="script.js"></script>

</body>

</html>
